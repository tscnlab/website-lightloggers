project:
  type: website
  output-dir: _site/lightloggers
  post-render:
    - python3 scripts/build-resources-home.py
  render:
    - index.qmd
    - evidence.qmd
  resources:
    - assets/site.css
    - assets/app.js
    - assets/tscn-logo.png
    - assets/favicon.png
    - assets/social-preview.png
    - assets/venues/**
    - data/library.json
    - data/validations.csv
    - data/references.bib
    - data/search-audit.json
    - data/search-decisions.csv
    - data/title-triage.csv
    - data/search/2026-11-10/*titles.json
    - index.qmd
    - evidence.qmd

website:
  title: "Light Logger Inventory · Translational Sensory & Circadian Neuroscience Unit"
  site-url: https://resources.tscnlab.org/lightloggers/
  image: assets/social-preview.png
  image-alt: "Light logger inventory — Translational Sensory & Circadian Neuroscience Unit (MPS/TUM/TUMCREATE)."
  open-graph:
    locale: en_GB
    site-name: "Translational Sensory & Circadian Neuroscience Unit"
    image-width: 1200
    image-height: 630
  twitter-card:
    card-style: summary_large_image
    image-width: 1200
    image-height: 630
  search: false

lang: en
jupyter: python3

format:
  html:
    theme: none
    minimal: true
    css: assets/site.css
    page-layout: full
    toc: false
    anchor-sections: false
    html-math-method: plain
    include-in-header:
      text: |
        <link rel="icon" type="image/png" href="assets/favicon.png">
        <meta property="og:type" content="website">
        <meta property="og:image:type" content="image/png">

execute:
  echo: false
  warning: false
  error: false
  cache: false
  freeze: false
  daemon: false
