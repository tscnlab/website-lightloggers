project:
  type: website
  output-dir: _site
  render:
    - index.qmd
  resources:
    - assets/**
    - data/checklist.json
    - data/context.json
    - sources/*.pdf
    - sources/README.md
    - index.qmd

website:
  title: "Translational Sensory & Circadian Neuroscience Unit"
  site-url: https://resources.tscnlab.org/enlight/
  image: assets/social-preview.png
  image-alt: "ENLIGHT lightbulb icon and Checklist Wizard: complete the reporting checklist and download your PDF."
  open-graph:
    locale: en_GB
    site-name: "ENLIGHT Checklist Wizard 🪄"
    image-width: 1200
    image-height: 630
  twitter-card:
    card-style: summary_large_image
  search: false

lang: en
jupyter: python3
format:
  html:
    theme: none
    minimal: true
    css: assets/site.css
    page-layout: full
    toc: false
    anchor-sections: false
    html-math-method: plain
    include-in-header:
      text: |
        <link rel="icon" type="image/png" sizes="64x64" href="assets/favicon-lightbulb.png">
        <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
        <link rel="canonical" href="https://resources.tscnlab.org/enlight/">
        <meta property="og:url" content="https://resources.tscnlab.org/enlight/">
        <meta property="og:type" content="website">
        <meta property="og:image:type" content="image/png">
execute:
  echo: false
  warning: false
  error: false
  cache: false
  freeze: false
  daemon: false
