<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Light logger directory social preview artwork</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#fff}
body{color:#073b4b;font-family:Arial,Helvetica,sans-serif}
.status{height:38px;background:#edf3f0;border-bottom:1px solid #d6dfdc;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:600;letter-spacing:.2px}
main{padding:36px 64px 0}
.brand{display:block;width:470px;height:auto}
h1{font:400 76px/1.06 Georgia,'Times New Roman',serif;letter-spacing:-1.6px;margin:48px 0 24px}
p{margin:0;font-size:25px;color:#54686e;line-height:1.5}
.measurements{display:flex;gap:21px;align-items:center;margin-top:22px;font-size:22px;color:#293e45}
.measurements span+span{border-left:1px solid #c2d1cc;padding-left:21px}
footer{position:absolute;left:64px;right:64px;bottom:38px;border-top:1px solid #d6dfdc;padding-top:22px;font-size:24px}
</style>
</head>
<body>
<div class="status">Work in progress</div>
<main>
  <img class="brand" src="tscn-logo.png" alt="Translational Sensory &amp; Circadian Neuroscience Unit (MPS/TUM/TUMCREATE)">
  <h1>Wearable light logger<br>validations</h1>
  <p>Find published validation studies.</p>
  <div class="measurements"><span>Photopic illuminance</span><span>Melanopic EDI</span><span>Angle dependence</span></div>
</main>
<footer>lightloggers.tscnlab.org</footer>
</body>
</html>
