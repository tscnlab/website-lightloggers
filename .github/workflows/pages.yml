name: Render and deploy TSCN resources
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Expand initial source upload
        if: hashFiles('site-source.zip') != ''
        run: |
          unzip -o site-source.zip
          git rm site-source.zip
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m 'Expand Quarto source, literature data and website assets'
          git push
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python -m pip install -r requirements.txt
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: '1.6.43'
      - uses: actions/configure-pages@v5
      - run: quarto render
      - name: Render ENLIGHT wizard
        run: python scripts/build-enlight.py
      - run: node --test tests/filtering.test.cjs
      - name: Verify ENLIGHT draft and PDF export
        run: node --test enlight/tests/state.test.mjs enlight/tests/pdf-export.test.cjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
